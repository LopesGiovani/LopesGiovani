<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="title description">
  <title id="title">Giovani Lopes — Engenharia de software, backend Java e IA aplicada</title>
  <desc id="description">Banner azul-escuro com detalhes ciano e um diagrama conectando software, APIs, inteligência artificial e dados.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#27415e" opacity=".5"/></pattern>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101d30"/><stop offset="1" stop-color="#0b1422"/></linearGradient>
    <linearGradient id="edge"><stop stop-color="#4de4d4"/><stop offset="1" stop-color="#6ea8fe"/></linearGradient>
  </defs>
  <rect width="1100" height="300" rx="18" fill="url(#surface)"/>
  <rect x="600" width="500" height="300" rx="18" fill="url(#grid)"/>
  <rect x="0" y="37" width="4" height="225" rx="2" fill="url(#edge)"/>
  <g font-family="'Segoe UI', Arial, sans-serif">
    <text x="48" y="54" fill="#4de4d4" font-size="15" font-family="Consolas, monospace" letter-spacing="2">SOFTWARE ENGINEERING</text>
    <text x="44" y="132" fill="#f1f6ff" font-size="66" font-weight="700" letter-spacing="-2.5">Giovani Lopes</text>
    <text x="48" y="178" fill="#b6c8dd" font-size="26">Backend Java <tspan fill="#4de4d4">/</tspan> IA aplicada</text>
    <path d="M48 211h375" stroke="#2a3b52"/>
    <text x="48" y="245" fill="#8da5c1" font-family="Consolas, monospace" font-size="14">IDEIA <tspan fill="#4de4d4">→</tspan> CÓDIGO <tspan fill="#4de4d4">→</tspan> VALIDAÇÃO</text>
    <g fill="none" stroke="#38516d" stroke-width="1.5">
      <path d="M718 88h58q16 0 16 16v28h40"/>
      <path d="M911 132h34q16 0 16-16V82h39"/>
      <path d="M870 155v59h89"/>
      <path d="M694 227h77q21 0 21-21v-53h40"/>
    </g>
    <g fill="#4de4d4"><circle cx="759" cy="88" r="3"/><circle cx="961" cy="105" r="3"/><circle cx="870" cy="193" r="3"/></g>
    <rect x="646" y="66" width="89" height="44" rx="8" fill="#122338" stroke="#304861"/>
    <text x="690" y="94" text-anchor="middle" fill="#b6c8dd" font-family="Consolas, monospace" font-size="16">API</text>
    <rect x="815" y="109" width="116" height="47" rx="9" fill="#12383c" stroke="#4de4d4"/>
    <text x="873" y="138" text-anchor="middle" fill="#99fff0" font-family="Consolas, monospace" font-size="16">SOFTWARE</text>
    <rect x="986" y="59" width="70" height="46" rx="8" fill="#122338" stroke="#304861"/>
    <text x="1021" y="88" text-anchor="middle" fill="#b6c8dd" font-family="Consolas, monospace" font-size="16">IA</text>
    <rect x="943" y="193" width="111" height="44" rx="8" fill="#122338" stroke="#304861"/>
    <text x="998" y="221" text-anchor="middle" fill="#b6c8dd" font-family="Consolas, monospace" font-size="16">DADOS</text>
    <rect x="643" y="205" width="89" height="44" rx="8" fill="#122338" stroke="#304861"/>
    <text x="687" y="233" text-anchor="middle" fill="#b6c8dd" font-family="Consolas, monospace" font-size="16">TESTES</text>
